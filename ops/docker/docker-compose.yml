services:
  postgres:
    image: postgres:16-alpine
    container_name: finops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: finops_db
    ports:
      - "5432:5432"
    volumes:
      - finops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: ops/docker/Dockerfile.api
    container_name: finops_api
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/finops_db
      - DATABASE_URL_SYNC=postgresql://postgres:postgrespassword@postgres:5432/finops_db
      - CORS_ORIGINS=["http://localhost:3000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../:/app

  web:
    build:
      context: ../../apps/web
      dockerfile: ../../ops/docker/Dockerfile.web
    container_name: finops_web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  finops_pgdata:
